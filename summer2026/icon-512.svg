<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a7a6d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde7c9"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- 外装饰：淡光斑 -->
  <circle cx="380" cy="120" r="140" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="100" cy="420" r="120" fill="#fde7c9" fill-opacity="0.12"/>
  <!-- 中环（琥珀色环） -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="url(#ring)" stroke-width="10" stroke-opacity="0.7"/>
  <!-- 内白卡 -->
  <rect x="112" y="128" width="288" height="288" rx="56" ry="56" fill="#ffffff" fill-opacity="0.98"/>
  <!-- 太阳 emoji 图形（用几何画，避免字体差异） -->
  <g transform="translate(256 216)">
    <!-- 光晕射线 -->
    <g stroke="#d97706" stroke-width="8" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-110" x2="0" y2="-138"/>
      <line x1="0" y1="110" x2="0" y2="138"/>
      <line x1="-110" y1="0" x2="-138" y2="0"/>
      <line x1="110" y1="0" x2="138" y2="0"/>
      <line x1="-78" y1="-78" x2="-98" y2="-98"/>
      <line x1="78" y1="-78" x2="98" y2="-98"/>
      <line x1="-78" y1="78" x2="-98" y2="98"/>
      <line x1="78" y1="78" x2="98" y2="98"/>
    </g>
    <!-- 太阳主体 -->
    <circle cx="0" cy="0" r="72" fill="#fbbf24"/>
    <circle cx="-20" cy="-16" r="10" fill="#fde7c9" fill-opacity="0.7"/>
  </g>
  <!-- 文字标题：交大2026暑假 -->
  <g font-family="Noto Serif SC, -apple-system, PingFang SC, Microsoft YaHei, serif" text-anchor="middle">
    <text x="256" y="356" font-size="40" font-weight="900" fill="#0f2724" letter-spacing="4">交大·2026</text>
    <text x="256" y="398" font-size="28" font-weight="700" fill="#1a7a6d" letter-spacing="6">暑 假 服 务</text>
  </g>
</svg>
