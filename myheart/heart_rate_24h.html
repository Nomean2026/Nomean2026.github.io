<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24小时心率对比图</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
  --bg: #f0f2f5;
  --card: #ffffff;
  --ink: #1a1a2e;
  --muted: #6b7280;
  --rule: #e5e7eb;
  --accent: #ef4444;
  --accent-light: #fee2e2;
  --accent-dark: #b91c1c;
  --blue: #3b82f6;
  --blue-light: #dbeafe;
  --blue-dark: #1e40af;
  --green: #10b981;
  --orange: #f59e0b;
  --radius: 14px;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--ink); line-height: 1.6;
  padding: 1rem; max-width: 1500px; margin: 0 auto;
}
.header {
  background: linear-gradient(135deg, #fff5f5 0%, #eff6ff 50%, #f0fdf4 100%);
  border-radius: var(--radius); padding: 1.5rem 2rem; margin-bottom: 1rem;
  border: 1px solid var(--rule); box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
}
.header-left h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.25rem; }
.header-left h1 .heart { color: var(--accent); animation: beat 1.5s ease-in-out infinite; display: inline-block; }
@keyframes beat { 0%,100% { transform: scale(1); } 10%,30% { transform: scale(1.2); } 20% { transform: scale(1.1); } }
.header-left .subtitle { color: var(--muted); font-size: 0.82rem; }
.header-right { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.header-badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
.badge-red { background: var(--accent-light); color: var(--accent-dark); }
.badge-blue { background: var(--blue-light); color: var(--blue-dark); }
.badge-green { background: #d1fae5; color: #065f46; }

.controls {
  background: var(--card); border-radius: var(--radius); padding: 1rem 1.5rem;
  margin-bottom: 0.75rem; border: 1px solid var(--rule); box-shadow: var(--shadow);
}
.control-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
.control-row:last-child { margin-bottom: 0; }
.control-label {
  font-size: 0.75rem; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.05em; min-width: 70px;
}
.btn-group { display: inline-flex; gap: 0; border-radius: 8px; overflow: hidden; border: 1.5px solid var(--rule); }
.btn-group button {
  padding: 0.38rem 0.85rem; border: none; background: var(--card); cursor: pointer;
  font-size: 0.8rem; font-weight: 500; color: var(--muted); transition: all 0.2s;
  border-right: 1.5px solid var(--rule);
}
.btn-group button:last-child { border-right: none; }
.btn-group button:hover { background: var(--bg); color: var(--ink); }
.btn-group button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
select {
  padding: 0.38rem 0.7rem; border: 1.5px solid var(--rule); border-radius: 8px;
  background: var(--card); font-size: 0.8rem; cursor: pointer; color: var(--ink);
}
select:focus { outline: none; border-color: var(--accent); }

.checkbox-group { display: inline-flex; flex-wrap: wrap; gap: 0.4rem; }
.checkbox-item {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.32rem 0.7rem; border-radius: 8px; cursor: pointer;
  border: 1.5px solid var(--rule); background: var(--card);
  font-size: 0.8rem; font-weight: 500; transition: all 0.2s; user-select: none;
}
.checkbox-item:hover { border-color: var(--accent); }
.checkbox-item.checked { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); }
.checkbox-item input { display: none; }

.color-preview {
  display: inline-flex; align-items: center; gap: 0.4rem; margin-left: 0.5rem;
  padding: 0.25rem 0.6rem; border-radius: 20px; background: var(--bg);
  font-size: 0.72rem; color: var(--muted);
}
.color-preview .gradient-bar { width: 100px; height: 10px; border-radius: 5px; display: inline-block; }

.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 0.6rem; margin-bottom: 0.75rem;
}
.stat-card {
  background: var(--card); border-radius: var(--radius); padding: 0.9rem 1.1rem;
  border: 1px solid var(--rule); box-shadow: var(--shadow); text-align: center;
}
.stat-card .stat-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; }
.stat-card .stat-value { font-size: 1.4rem; font-weight: 800; margin-top: 0.15rem; }
.stat-card .stat-unit { font-size: 0.7rem; color: var(--muted); }
.stat-card.red .stat-value { color: var(--accent); }
.stat-card.blue .stat-value { color: var(--blue); }
.stat-card.green .stat-value { color: var(--green); }
.stat-card.orange .stat-value { color: var(--orange); }

.chart-container {
  background: var(--card); border-radius: var(--radius); padding: 1rem;
  border: 1px solid var(--rule); box-shadow: var(--shadow); margin-bottom: 0.75rem;
}
#chart { width: 100%; height: 580px; }

.day-list {
  background: var(--card); border-radius: var(--radius); padding: 1rem 1.5rem;
  border: 1px solid var(--rule); box-shadow: var(--shadow); margin-bottom: 0.75rem;
}
.day-list h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.5rem; }
.day-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; max-height: 120px; overflow-y: auto; }
.day-chip {
  padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.72rem; cursor: pointer;
  border: 1.5px solid var(--rule); background: var(--card); transition: all 0.2s;
}
.day-chip:hover { border-color: var(--accent); }
.day-chip.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); font-weight: 600; }
.day-chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 3px; }

.insights {
  background: var(--card); border-radius: var(--radius); padding: 1rem 1.5rem;
  border: 1px solid var(--rule); box-shadow: var(--shadow); margin-bottom: 0.75rem;
}
.insights h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.5rem; }
.insight-item {
  display: inline-block; padding: 0.3rem 0.7rem; margin: 0.2rem 0.3rem 0.2rem 0;
  border-radius: 8px; font-size: 0.78rem; background: var(--bg);
}
.insight-item strong { color: var(--accent); }
.insight-item.blue strong { color: var(--blue); }
.insight-item.green strong { color: var(--green); }

.hidden { display: none !important; }

@media (max-width: 768px) {
  .control-row { flex-direction: column; align-items: flex-start; }
  .control-label { min-width: auto; }
  #chart { height: 400px; }
  .header-left h1 { font-size: 1.2rem; }
  .header { padding: 1rem; }
}

.loading {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.85); display: flex; align-items: center;
  justify-content: center; z-index: 9999; font-size: 1.1rem; color: var(--accent);
}
.loading.hidden { display: none; }
.spinner {
  width: 40px; height: 40px; border: 4px solid var(--accent-light);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 1s linear infinite; margin-right: 0.8rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <span>正在生成图表...</span>
</div>

<div class="header">
  <div class="header-left">
    <h1><span class="heart">&#10084;</span> 24小时心率对比图</h1>
    <p class="subtitle">华为运动健康 | 73889 个心率点 | 322 天 | 2025-07-25 至 2026-07-28</p>
  </div>
  <div class="header-right">
    <span class="header-badge badge-red">每分钟心率</span>
    <span class="header-badge badge-blue">多日叠加</span>
    <span class="header-badge badge-green">24小时对比</span>
  </div>
</div>

<div class="controls">
  <div class="control-row">
    <span class="control-label">时间范围</span>
    <div class="btn-group" id="range-btns">
      <button class="active" data-range="7" onclick="selectRange(7)">最近一周</button>
      <button data-range="14" onclick="selectRange(14)">最近两周</button>
      <button data-range="30" onclick="selectRange(30)">最近一月</button>
      <button data-range="custom" onclick="selectRange('custom')">自定义时段</button>
    </div>
    <input type="date" id="date-start" class="hidden" onchange="onDateChange()" style="padding:0.35rem;border:1.5px solid var(--rule);border-radius:8px;font-size:0.8rem;">
    <span class="hidden" id="date-sep" style="color:var(--muted)">至</span>
    <input type="date" id="date-end" class="hidden" onchange="onDateChange()" style="padding:0.35rem;border:1.5px solid var(--rule);border-radius:8px;font-size:0.8rem;">
  </div>
  
  <div class="control-row">
    <span class="control-label">色彩方案</span>
    <div class="btn-group" id="color-btns">
      <button class="active" data-color="mono" onclick="selectColor('mono')">单色系（时间渐变）</button>
      <button data-color="multi" onclick="selectColor('multi')">多色彩</button>
    </div>
    <span class="color-preview" id="color-preview">
      <span class="gradient-bar" id="gradient-bar"></span>
      <span id="color-text">远→近，浅→深</span>
    </span>
  </div>

  <div class="control-row">
    <span class="control-label">每分钟取值</span>
    <div class="btn-group" id="metric-btns">
      <button class="active" data-metric="avg" onclick="selectMetric('avg')">平均值</button>
      <button data-metric="max" onclick="selectMetric('max')">最大值</button>
      <button data-metric="min" onclick="selectMetric('min')">最小值</button>
    </div>
    <span style="color:var(--muted);font-size:0.75rem;margin-left:0.5rem">同一分钟内多个读数时按此规则聚合</span>
  </div>

  <div class="control-row">
    <span class="control-label">显示选项</span>
    <div class="checkbox-group" id="display-opts">
      <label class="checkbox-item checked" data-opt="showArea">
        <input type="checkbox" checked>面积填充
      </label>
      <label class="checkbox-item" data-opt="smooth">
        <input type="checkbox">曲线平滑
      </label>
      <label class="checkbox-item checked" data-opt="showPoints">
        <input type="checkbox" checked>显示数据点
      </label>
      <label class="checkbox-item" data-opt="avgLine">
        <input type="checkbox">叠加每日均值线
      </label>
    </div>
  </div>
</div>

<div class="stats-grid" id="stats-grid"></div>

<div class="chart-container">
  <div id="chart"></div>
</div>

<div class="day-list">
  <h3>&#128197; 当前展示的天数（点击可隐藏/显示）</h3>
  <div class="day-chips" id="day-chips"></div>
</div>

<div class="insights" id="insights-box">

  <div id="insights-content"></div>
</div>

// ==================== Config ====================
// Monochrome palettes: light -> dark
var MONO_PALETTES = {
  red: ['#fecaca','#fca5a5','#f87171','#ef4444','#dc2626','#b91c1c','#7f1d1d','#5f0e0e'],
};

// Multi-color palette for different days
var MULTI_COLORS = [
  '#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899',
  '#06b6d4','#84cc16','#f97316','#6366f1','#14b8a6','#e11d48',
  '#a855f7','#eab308','#22c55e','#0ea5e9','#f43f5e','#8b5cf6',
  '#10b981','#f59e0b','#3b82f6','#ef4444','#14b8a6','#ec4899',
  '#6366f1','#f97316','#84cc16','#06b6d4','#a855f7','#e11d48',
];

// ==================== State ====================
var state = {
  range: 7,
  customStart: null,
  customEnd: null,
  colorScheme: 'mono',
  metric: 'avg',   // 'avg' | 'max' | 'min'
  hiddenDays: {},
  opts: { showArea: true, smooth: false, showPoints: false, avgLine: false },
};

var chart = null;

// ==================== Init ====================
function init() {
  chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });
  window.addEventListener('resize', function() { chart.resize(); });

  // Set date input limits
  var dates = HOURLY_DATA.map(function(d) { return d.date; });
  document.getElementById('date-start').min = dates[0];
  document.getElementById('date-start').max = dates[dates.length-1];
  document.getElementById('date-end').min = dates[0];
  document.getElementById('date-end').max = dates[dates.length-1];

  // Bind display option checkboxes
  bindDisplayOpts();

  updateColorPreview();
  renderChart();
  document.getElementById('loading').classList.add('hidden');
}

// ==================== Display options ====================
function bindDisplayOpts() {
  document.querySelectorAll('#display-opts .checkbox-item').forEach(function(item) {
    item.addEventListener('click', function(e) {
      e.preventDefault();
      var opt = item.getAttribute('data-opt');
      var isChecked = item.classList.contains('checked');
      if (isChecked) {
        item.classList.remove('checked');
        item.querySelector('input').checked = false;
        state.opts[opt] = false;
      } else {
        item.classList.add('checked');
        item.querySelector('input').checked = true;
        state.opts[opt] = true;
      }
      renderChart();
    });
  });
}

// ==================== Range selection ====================
function selectRange(range) {
  state.range = range;
  document.querySelectorAll('#range-btns button').forEach(function(b) {
    var val = b.getAttribute('data-range');
    b.classList.toggle('active', val === String(range));
  });
  
  var ds = document.getElementById('date-start');
  var de = document.getElementById('date-end');
  var sep = document.getElementById('date-sep');
  
  if (range === 'custom') {
    ds.classList.remove('hidden');
    de.classList.remove('hidden');
    sep.classList.remove('hidden');
    // Default to last 14 days
    var dates = HOURLY_DATA.map(function(d) { return d.date; });
    if (!ds.value) {
      var startIdx = Math.max(0, dates.length - 14);
      ds.value = dates[startIdx];
      de.value = dates[dates.length - 1];
      state.customStart = ds.value;
      state.customEnd = de.value;
    }
  } else {
    ds.classList.add('hidden');
    de.classList.add('hidden');
    sep.classList.add('hidden');
  }
  renderChart();
}

function onDateChange() {
  state.customStart = document.getElementById('date-start').value;
  state.customEnd = document.getElementById('date-end').value;
  if (state.customStart && state.customEnd) {
    renderChart();
  }
}

function selectColor(scheme) {
  state.colorScheme = scheme;
  document.querySelectorAll('#color-btns button').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-color') === scheme);
  });
  updateColorPreview();
  renderChart();
}

function updateColorPreview() {
  var bar = document.getElementById('gradient-bar');
  var text = document.getElementById('color-text');
  if (state.colorScheme === 'mono') {
    bar.style.background = 'linear-gradient(to right, #fecaca, #ef4444, #5f0e0e)';
    text.textContent = '远→近，浅→深';
  } else {
    bar.style.background = 'linear-gradient(to right, #ef4444, #3b82f6, #10b981, #f59e0b, #8b5cf6, #ec4899)';
    text.textContent = '每天独立配色';
  }
}

function selectMetric(metric) {
  state.metric = metric;
  document.querySelectorAll('#metric-btns button').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-metric') === metric);
  });
  renderChart();
}

// ==================== Get selected data ====================
function getSelectedData() {
  var sorted = HOURLY_DATA.slice().sort(function(a,b) { return a.date.localeCompare(b.date); });
  
  if (state.range === 'custom' && state.customStart && state.customEnd) {
    return sorted.filter(function(d) {
      return d.date >= state.customStart && d.date <= state.customEnd;
    });
  } else if (typeof state.range === 'number') {
    return sorted.slice(-state.range);
  }
  return sorted.slice(-7);
}

// ==================== Color helpers ====================
function getMonoColor(index, total) {
  var palette = MONO_PALETTES.red;
  if (total <= 1) return palette[palette.length - 1];
  var pos = Math.floor((index / (total - 1)) * (palette.length - 1));
  return palette[pos];
}

function getMultiColor(index) {
  return MULTI_COLORS[index % MULTI_COLORS.length];
}

function getDayColor(index, total) {
  if (state.colorScheme === 'mono') {
    return getMonoColor(index, total);
  } else {
    return getMultiColor(index);
  }
}

// ==================== Chart rendering ====================
function renderChart() {
  var data = getSelectedData();
  var visibleData = data.filter(function(d) { return !state.hiddenDays[d.date]; });
  
  if (visibleData.length === 0) {
    chart.setOption({}, true);
    document.getElementById('stats-grid').innerHTML = '';
    document.getElementById('day-chips').innerHTML = '<span style="color:var(--muted);font-size:0.8rem">没有可显示的数据</span>';
    document.getElementById('insights-content').innerHTML = '<span style="color:var(--muted)">请选择至少一天的数据</span>';
    return;
  }

  // Build x-axis: every minute of the day (0 to 1439)
  var xMinutes = [];
  for (var m = 0; m < 1440; m++) {
    xMinutes.push(m);
  }

  var series = [];
  var total = visibleData.length;

  // Build series for each day
  visibleData.forEach(function(dayData, idx) {
    var points = dayData.points;
    var color = getDayColor(idx, total);
    
    // Group points by minute, then aggregate by selected metric
    var minuteMap = {};
    points.forEach(function(p) {
      var minute = p[0];
      var hr = p[1];
      if (!minuteMap[minute]) minuteMap[minute] = [];
      minuteMap[minute].push(hr);
    });
    
    // Create data array aligned with xMinutes (one point per minute)
    var metric = state.metric;
    var dataArr = xMinutes.map(function(m) {
      if (minuteMap[m] && minuteMap[m].length > 0) {
        var vals = minuteMap[m];
        if (metric === 'max') {
          return Math.max.apply(null, vals);
        } else if (metric === 'min') {
          return Math.min.apply(null, vals);
        } else {
          var sum = vals.reduce(function(a,b){return a+b;}, 0);
          return Math.round(sum / vals.length);
        }
      }
      return null;
    });

    var seriesItem = {
      name: dayData.date,
      type: 'line',
      data: dataArr,
      smooth: state.opts.smooth,
      symbol: state.opts.showPoints ? 'circle' : 'none',
      symbolSize: 3,
      showSymbol: state.opts.showPoints,
      lineStyle: { width: 1.2, color: color, opacity: 0.55 },
      itemStyle: { color: color, borderColor: '#fff', borderWidth: 1 },
      connectNulls: false,
      z: total - idx,
      emphasis: { focus: 'series' },
    };

    if (state.opts.showArea) {
      seriesItem.areaStyle = {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: color + '10' },
          { offset: 1, color: color + '02' }
        ]),
        opacity: 0.3,
      };
    }

    series.push(seriesItem);
  });

  // Cross-day aggregation line based on selected metric (max / min / avg across days)
  if (visibleData.length >= 1) {
    var metricLabel = state.metric === 'max' ? '跨天最大值' : state.metric === 'min' ? '跨天最小值' : '跨天平均值';
    var metricColor = state.metric === 'max' ? '#ef4444' : state.metric === 'min' ? '#3b82f6' : '#10b981';
    var crossData = xMinutes.map(function(m, mIdx) {
      var vals = [];
      series.forEach(function(s) {
        if (s.data && s.data[mIdx] !== null && s.name !== metricLabel && s.name !== '每日均值') {
          vals.push(s.data[mIdx]);
        }
      });
      if (vals.length === 0) return null;
      if (state.metric === 'max') return Math.max.apply(null, vals);
      if (state.metric === 'min') return Math.min.apply(null, vals);
      return Math.round(vals.reduce(function(a,b){return a+b;},0) / vals.length);
    });

    series.push({
      name: metricLabel,
      type: 'line',
      data: crossData,
      smooth: true,
      symbol: 'none',
      lineStyle: { width: 3.5, color: metricColor },
      z: 200,
      emphasis: { focus: 'series' },
    });
  }

  // Optional: average line
  if (state.opts.avgLine && visibleData.length > 1) {
    var avgData = xMinutes.map(function(m, mIdx) {
      var sum = 0, count = 0;
      series.forEach(function(s) {
        if (s.data[mIdx] !== null) {
          sum += s.data[mIdx];
          count++;
        }
      });
      return count > 0 ? Math.round(sum / count) : null;
    });
    
    series.push({
      name: '每日均值',
      type: 'line',
      data: avgData,
      smooth: true,
      symbol: 'none',
      lineStyle: { width: 3, color: '#1a1a2e', type: 'dashed' },
      z: 100,
      emphasis: { focus: 'series' },
    });
  }

  var option = {
    backgroundColor: 'transparent',
    title: {
      text: '24小时心率对比（每分钟 · ' + (state.metric === 'max' ? '最大值' : state.metric === 'min' ? '最小值' : '平均值') + '）',
      left: 'center', top: 5,
      textStyle: { fontSize: 15, fontWeight: 700, color: '#1a1a2e' },
      subtext: getStateSubtext(visibleData),
      subtextStyle: { fontSize: 11, color: '#6b7280' }
    },
    tooltip: {
      trigger: 'axis',
      backgroundColor: 'rgba(255,255,255,0.96)',
      borderColor: '#e5e7eb', borderWidth: 1,
      textStyle: { color: '#1a1a2e', fontSize: 11 },
      axisPointer: { type: 'cross', label: { backgroundColor: '#6b7280' } },
      formatter: function(params) {
        var time = params[0].axisValue;
        var h = Math.floor(time / 60);
        var m = time % 60;
        var timeStr = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
        var html = '<div style="font-weight:700;margin-bottom:4px">时间: ' + timeStr + '</div>';
        // Sort by value descending
        params.sort(function(a,b) { return (b.value||0) - (a.value||0); });
        params.forEach(function(p) {
          if (p.value !== null && p.value !== undefined && p.value !== '-') {
            html += '<div style="margin:1px 0">' +
              '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' +
              p.color + ';margin-right:6px"></span>' +
              p.seriesName + ': <strong>' + p.value + ' bpm</strong></div>';
          }
        });
        return html;
      }
    },
    legend: {
      type: 'scroll',
      bottom: 5,
      textStyle: { fontSize: 10, color: '#6b7280' },
      itemWidth: 18, itemHeight: 10,
    },
    grid: { left: '2%', right: '2%', top: 75, bottom: 70, containLabel: true },
    xAxis: {
      type: 'category',
      data: xMinutes,
      boundaryGap: false,
      axisLine: { lineStyle: { color: '#e5e7eb' } },
      axisLabel: {
        color: '#6b7280', fontSize: 10,
        interval: function(index, value) {
          // Show every 2 hours (every 120 minutes)
          return value % 120 === 0;
        },
        formatter: function(value) {
          var h = Math.floor(value / 60);
          var m = value % 60;
          return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
        }
      },
      splitLine: { show: false },
    },
    yAxis: {
      type: 'value', name: '心率 (bpm)',
      nameTextStyle: { color: '#6b7280', fontSize: 11 },
      axisLine: { show: false }, axisTick: { show: false },
      axisLabel: { color: '#6b7280', fontSize: 11 },
      splitLine: { lineStyle: { color: '#f3f4f6', type: 'dashed' } },
      min: 30, max: 200,
    },
    dataZoom: [
      { type: 'inside', start: 0, end: 100 },
      { type: 'slider', start: 0, end: 100, height: 18, bottom: 28 }
    ],
    series: series,
    animation: true,
    animationDuration: 600,
    animationEasing: 'cubicOut',
  };

  chart.setOption(option, true);
  renderStats(visibleData);
  renderDayChips(data);
  renderInsights(visibleData);
}

function getStateSubtext(visibleData) {
  var n = visibleData.length;
  if (n === 0) return '';
  var first = visibleData[0].date;
  var last = visibleData[n-1].date;
  var scheme = state.colorScheme === 'mono' ? '单色系渐变' : '多色彩';
  var metricLabel = state.metric === 'max' ? '最大值' : state.metric === 'min' ? '最小值' : '平均值';
  return '共 ' + n + ' 天 (' + first + ' ~ ' + last + ') | ' + scheme + ' | 每分钟' + metricLabel;
}

// ==================== Stats ====================
function renderStats(data) {
  var grid = document.getElementById('stats-grid');
  var allValues = [];
  var dayAvgs = [];
  
  data.forEach(function(d) {
    var vals = d.points.map(function(p) { return p[1]; });
    if (vals.length > 0) {
      var avg = vals.reduce(function(a,b){return a+b;},0) / vals.length;
      dayAvgs.push({date: d.date, avg: avg, min: Math.min.apply(null, vals), max: Math.max.apply(null, vals)});
      allValues = allValues.concat(vals);
    }
  });

  if (allValues.length === 0) { grid.innerHTML = ''; return; }

  var overallAvg = (allValues.reduce(function(a,b){return a+b;},0) / allValues.length).toFixed(1);
  var overallMax = Math.max.apply(null, allValues);
  var overallMin = Math.min.apply(null, allValues);
  
  // Find peak time across all days
  var hourCounts = {};
  for (var h = 0; h < 24; h++) hourCounts[h] = [];
  data.forEach(function(d) {
    d.points.forEach(function(p) {
      var h = Math.floor(p[0] / 60);
      hourCounts[h].push(p[1]);
    });
  });
  var peakHour = 0, peakAvg = 0;
  for (var h = 0; h < 24; h++) {
    if (hourCounts[h].length > 0) {
      var avg = hourCounts[h].reduce(function(a,b){return a+b;},0) / hourCounts[h].length;
      if (avg > peakAvg) { peakAvg = avg; peakHour = h; }
    }
  }

  var html = '';
  var metricLabel = state.metric === 'max' ? '最大' : state.metric === 'min' ? '最小' : '平均';
  html += '<div class="stat-card red"><div class="stat-label">整体' + metricLabel + '心率</div><div class="stat-value">' + overallAvg + '</div><div class="stat-unit">bpm</div></div>';
  html += '<div class="stat-card orange"><div class="stat-label">最高心率</div><div class="stat-value">' + overallMax + '</div><div class="stat-unit">bpm</div></div>';
  html += '<div class="stat-card blue"><div class="stat-label">最低心率</div><div class="stat-value">' + overallMin + '</div><div class="stat-unit">bpm</div></div>';
  html += '<div class="stat-card green"><div class="stat-label">峰值时段</div><div class="stat-value">' + String(peakHour).padStart(2,'0') + ':00</div><div class="stat-unit">均值 ' + peakAvg.toFixed(0) + ' bpm</div></div>';
  html += '<div class="stat-card"><div class="stat-label">展示天数</div><div class="stat-value">' + data.length + '</div><div class="stat-unit">天</div></div>';
  
  grid.innerHTML = html;
}

// ==================== Day chips ====================
function renderDayChips(allData) {
  var container = document.getElementById('day-chips');
  var html = '';
  var total = allData.length;
  
  allData.forEach(function(d, idx) {
    var isHidden = state.hiddenDays[d.date];
    var color = getDayColor(idx, total);
    var cls = isHidden ? 'day-chip' : 'day-chip active';
    html += '<span class="' + cls + '" onclick="toggleDay(\'' + d.date + '\')">' +
      '<span class="dot" style="background:' + (isHidden ? '#ccc' : color) + '"></span>' +
      d.date + ' (' + d.points.length + '点)</span>';
  });
  
  container.innerHTML = html;
}

function toggleDay(date) {
  if (state.hiddenDays[date]) {
    delete state.hiddenDays[date];
  } else {
    state.hiddenDays[date] = true;
  }
  renderChart();
}

// ==================== Insights ====================
function renderInsights(data) {
  var box = document.getElementById('insights-content');
  var html = '';

  // Peak hour analysis
  var hourData = {};
  for (var h = 0; h < 24; h++) hourData[h] = [];
  data.forEach(function(d) {
    d.points.forEach(function(p) {
      var hr = Math.floor(p[0] / 60);
      hourData[hr].push(p[1]);
    });
  });

  var peakHour = 0, peakAvg = 0;
  var lowHour = 0, lowAvg = 999;
  for (var h = 0; h < 24; h++) {
    if (hourData[h].length > 5) {
      var avg = hourData[h].reduce(function(a,b){return a+b;},0) / hourData[h].length;
      if (avg > peakAvg) { peakAvg = avg; peakHour = h; }
      if (avg < lowAvg) { lowAvg = avg; lowHour = h; }
    }
  }

  html += '<span class="insight-item">心率最高的时段在 <strong>' + String(peakHour).padStart(2,'0') + ':00</strong> 左右，均值 <strong>' + peakAvg.toFixed(0) + ' bpm</strong></span>';
  html += '<span class="insight-item blue">心率最低的时段在 <strong>' + String(lowHour).padStart(2,'0') + ':00</strong> 左右，均值 <strong>' + lowAvg.toFixed(0) + ' bpm</strong></span>';

  // Day-to-day variability
  if (data.length >= 2) {
    var dayAvgs = data.map(function(d) {
      var vals = d.points.map(function(p){return p[1];});
      return vals.length > 0 ? vals.reduce(function(a,b){return a+b;},0)/vals.length : 0;
    }).filter(function(v){return v > 0;});
    
    if (dayAvgs.length >= 2) {
      var maxAvg = Math.max.apply(null, dayAvgs);
      var minAvg = Math.min.apply(null, dayAvgs);
      var diff = maxAvg - minAvg;
      html += '<span class="insight-item green">日均心率波动 <strong>' + diff.toFixed(1) + ' bpm</strong>（' + minAvg.toFixed(0) + '~' + maxAvg.toFixed(0) + '）</span>';
    }
  }

  // Morning vs afternoon
  var morningVals = [], afternoonVals = [];
  data.forEach(function(d) {
    d.points.forEach(function(p) {
      var h = Math.floor(p[0] / 60);
      if (h >= 6 && h < 12) morningVals.push(p[1]);
      else if (h >= 12 && h < 18) afternoonVals.push(p[1]);
    });
  });
  if (morningVals.length > 0 && afternoonVals.length > 0) {
    var mAvg = morningVals.reduce(function(a,b){return a+b;},0) / morningVals.length;
    var aAvg = afternoonVals.reduce(function(a,b){return a+b;},0) / afternoonVals.length;
    var diff = aAvg - mAvg;
    var trend = diff > 0 ? '高于' : '低于';
    html += '<span class="insight-item">下午心率均值 <strong>' + aAvg.toFixed(0) + '</strong> ' + trend + '上午 <strong>' + mAvg.toFixed(0) + ' bpm</strong></span>';
  }

  // Data coverage
  var totalPoints = data.reduce(function(sum, d) { return sum + d.points.length; }, 0);
  html += '<span class="insight-item blue">总数据点 <strong>' + totalPoints + '</strong> 个，平均每天 <strong>' + Math.round(totalPoints / data.length) + '</strong> 点</span>';

  box.innerHTML = html;
}

// ==================== Boot ====================
window.addEventListener('DOMContentLoaded', init);
</script>
